[package]
name = "labonair-keymap"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "labonair_keymap"
path = "src/lib.rs"

[dependencies]
labonair-command-palette-core = { path = "../command-palette-core" }
serde_json = { workspace = true }
jsonc-parser = { version = "0.23", features = ["serde"] }
dirs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
