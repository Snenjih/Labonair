[package]
name = "labonair-forwards-ui"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "labonair_forwards_ui"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
labonair-ssh = { path = "../ssh" }
labonair-forwards = { path = "../forwards" }
labonair-theme = { path = "../theme" }
labonair-ui-kit = { path = "../ui-kit" }
labonair-panel = { path = "../panel" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
